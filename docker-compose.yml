services:
  db:
    image: postgres:16
    container_name: llm-eval-db
    environment:
      POSTGRES_USER: eval
      POSTGRES_PASSWORD: eval
      POSTGRES_DB: evalboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eval -d evalboard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
